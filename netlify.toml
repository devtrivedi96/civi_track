[build]
  command = "npm run netlify-build"
  publish = "dist"
  functions = "netlify/functions"
  command = "chmod +x netlify-build.sh && ./netlify-build.sh"
  publish = "dist"
  base = "."

[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  CI = "false"
  VITE_NODE_ENV = "production"
  NODE_ENV = "production"
  
[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

