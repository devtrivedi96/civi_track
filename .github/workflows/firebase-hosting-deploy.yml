name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: |
          npm ci
          cd server && npm ci
          cd ..

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyCh0LnJSHAhJZkr1RM3hNnJHPm43I4q0p8"
          VITE_FIREBASE_AUTH_DOMAIN: "civic-issue-sih-bac7e.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "civic-issue-sih-bac7e"
          VITE_FIREBASE_STORAGE_BUCKET: "civic-issue-sih-bac7e.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "973217616582"
          VITE_FIREBASE_APP_ID: "1:973217616582:web:34bbdbdcf8e99468a13dc7"
          VITE_FIREBASE_MEASUREMENT_ID: "G-ZN30BENWZ9"

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: "civic-issue-sih-bac7e"
          channelId: live
          target: civic-issue-sih-bac7e
