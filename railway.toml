[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:all"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "client"
directory = "."
configFile = "railway.client.json"

[[services]]
name = "server"
directory = "server"
configFile = "railway.server.json"