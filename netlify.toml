[build]
  command = "npm run netlify-build"
  publish = "dist"
  base = "."

[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "8"
  CI = "false"
  NODE_ENV = "production"
  
[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"